title: DooJank
description: DooJank — a personal journal on philosophy, attention, and everyday life.
lang: zh-CN
url: https://lumisum.github.io
baseurl: /doojank
social_image: /assets/doojank/river-hero.webp
social_image_alt: A traveler crosses a misty river at sunset — DooJank
markdown: kramdown
permalink: pretty
# Articles are offline during the content rebuild (2026-10-11).
# Keep archives excluded. Publish selected new pages in journal/ and assets in assets/articles/.
exclude:
  - articles
  - en/articles
  - assets/doojank/essay-thumbs
  - .agents
  - articles/README.md
  - articles/**/wechat.md
  - articles/**/wechat.html
  - articles/**/production.md
  - articles/**/x.md
  - articles/**/x-*.md
  - articles/**/x.html
  - articles/**/images/prompts.md
  - guides
  - scripts
  - templates
  - README.md
